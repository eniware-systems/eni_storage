name: eni_storage
description: "Eniware Systems App Storage Package"
version: 2.0.4
homepage: https://eniware-systems.de
publish_to: https://gitea.eniware-systems.de/api/packages/eni-flutter/pub

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  eni_svc:
    git:
      url: https://github.com/eniware-systems/eni_svc.git
      ref: 2.0.6
  eni_utils:
    git:
      url: https://github.com/eniware-systems/eni_utils.git
      ref: 2.0.3
  drift: ^2.28.0
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  assets:
    - sqlite3.wasm
    - drift_worker.js